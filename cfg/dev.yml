# Configuración de entorno - Efectividad SMS
env: dev

# Rutas de datos (relativas al directorio del proyecto)
paths:
  data: ./data
  vendor: ./vendor
  transfer: ./transfers
  export: ./exportaciones
  catalog: ./cfg/

# Configuración de estados del proveedor
statuses:
  - application_status: SUBMITD
    platform_status: DELIVRD
    estado_proveedor: "EXITOSO"
    estado_operadora: "EXITOSO"

  - application_status: SUBMITD
    platform_status: UNDELIV
    estado_proveedor: "EXITOSO"
    estado_operadora: "RECHAZADO"

  - application_status: UNDELIV
    platform_status: UNDELIV
    estado_proveedor: "RECHAZADO"
    estado_operadora: "RECHAZADO"

  - application_status: "*"
    platform_status: "--"
    estado_proveedor: "RECHAZADO"
    estado_operadora: "RECHAZADO"

# Credenciales (valores placeholder - los reales se leen de ENV)
# SFTP_HOST, SFTP_PORT, SFTP_UID, SFTP_PWD
# AS400_USER, AS400_PASS

# Configuración de transferencias AS400
as400:
  transfer_icons: ["Broadcast.dtfx", "MetroLine.dtfx"]
  system: AS400F35
  acsbundle_path: ./bin/acsbundle.jar

# Configuración SFTP
sftp:
  remote_path: ./LINK MOBILE LINKMBL BTS_ SMS/

# Columnas del gestor (CSV broadcast/megareport)
gestor_columns:
  - Fecha
  - Entidad
  - Marca
  - Hora
  - IdCodigo
  - Tarjeta_Cuenta
  - Cedula
  - NumCel
  - Mensaje
  - ConfId
  - IdUsuario

# Columnas del archivo del proveedor
vendor_columns:
  - MobileNumber
  - ShortCode
  - Message
  - Priority
  - TotalFragments
  - Type
  - Carrier
  - Date
  - TransactionId
  - ApplicationStatus
  - ResponseCode
  - PlatformStatus
  - DescriptionStatus

# Checks de validación por defecto
validation_checks:
  "0270": "Consumos"
  "0002": "Pagos"
  "0001": "Saldos"
  "0969": "Actuales cierre"
  "4225": "OTP Placetopay"
  "0923": "Actuales cierre"
  "0260": "PINES"
  "0279": "Consumos ATM"

# Configuración de报告es adicionales (entidades externas)
other_reports:
  BcoPichincha: PI
  BGR: RU

# Umbral de aceptación para validación
validation_threshold:
  pass: 0.99
  warning: 0.95

# configuracion reporte salida
output_columns:
  - Fecha_Hora
  - Fecha
  - Hora
  - Entidad
  - Marca
  - CdMensaje
  - Desc_Banco_Envio
  - Tarjeta_Cuenta
  - Num_Doc_Identificacion
  - NumCelular
  - IdUsuario
  - Mensaje
  - TransactionId
  - Desc_Operadora
  - ApplicationStatus
  - PlatformStatus
  - Desc_Campania
  - Desc_AreaCampania
  - Tipo_Campania
  - Cd_Enlace
  - Estado_Operadora
  - Desc_Notificacion
  - Desc_Area
  - Estado_Proveedor
  - DescriptionStatus
  - Volumen_30d
  - Porc_Exitoso
  - Porc_Rechazado
