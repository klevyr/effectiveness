[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "efectividad"
version = "0.1.0"
description = "Generador de reportes de efectividad"
authors = [
    { name = "Klever Ramon" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "polars[calendars,xlsx]>=1.0",
  "paramiko",
  "pyarrow",
  "pyyaml",
  "python-dotenv",
  "typer[all]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
efectividad = "efectividad.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"